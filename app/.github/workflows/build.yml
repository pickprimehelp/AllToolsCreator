name: AllToolsCreator Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AllToolsCreator
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # 4. Create required folders
      - name: Create Android folders
        run: |
          mkdir -p app/src/main/java/com/pickprime/alltoolscreator
          mkdir -p app/src/main/res/values

      # 5. Android Manifest
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="All Tools Creator"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # 6. MainActivity
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/pickprime/alltoolscreator/MainActivity.kt <<'EOF'
          package com.pickprime.alltoolscreator

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)

                  layout.orientation = LinearLayout.VERTICAL
                  layout.gravity = Gravity.CENTER
                  layout.setBackgroundColor(Color.WHITE)

                  val title = TextView(this)

                  title.text = "All Tools Creator"
                  title.textSize = 28f
                  title.setTextColor(Color.BLACK)
                  title.gravity = Gravity.CENTER

                  val subtitle = TextView(this)

                  subtitle.text = "\nYour all-in-one tools app"
                  subtitle.textSize = 16f
                  subtitle.setTextColor(Color.DKGRAY)
                  subtitle.gravity = Gravity.CENTER

                  layout.addView(title)
                  layout.addView(subtitle)

                  setContentView(layout)
              }
          }
          EOF

      # 7. Strings
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">All Tools Creator</string>
          </resources>
          EOF

      # 8. Build
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllToolsCreator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
